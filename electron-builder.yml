# Packaging for the macOS app. Run `pnpm package:stage` first (it fetches and stages llama-server
# and builds and stages the Swift helper), then build.
appId: app.designstash
productName: DesignStash
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  target:
    - target: dmg
      arch: arm64
  # Signing walks every Mach-O file in the app, the extra resources included, so llama-server and
  # the Swift helper are signed with the app's identity and the hardened runtime whenever one is
  # configured (CSC_LINK, or a Developer ID in the keychain). With none, signing is skipped and the
  # build still runs unsigned for development. The helper is signed without entitlements; check
  # Vision and Foundation Models on the first signed build (design/specs/ai.md, "Open").
  hardenedRuntime: true
# The migrations, llama-server and the Swift helper are read at run time from <resources>, next
# to the app. The main process looks for the helper at <resources>/helper/designstash-helper.
extraResources:
  - from: drizzle
    to: drizzle
  - from: build/llama-server
    to: llama-server
    filter:
      - '**/*'
  - from: build/helper
    to: helper
    filter:
      - designstash-helper
