# Packaging for the macOS app. Run `pnpm package:stage` first (it fetches and stages llama-server
# and builds and stages the Swift helper), then build.
appId: app.designstash
productName: DesignStash
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
publish: null # releases are made by .github/workflows/release.yml, not by electron-builder
# Burnt into the Electron binary before signing (scripts/packaging/fuses.test.ts). The app never
# runs as plain Node (ELECTRON_RUN_AS_NODE) or takes code from NODE_OPTIONS, and it loads only its
# own app.asar, checked against the hash electron-builder writes into Info.plist. --inspect stays:
# Playwright drives the packaged app through it in e2e (DESIGNSTASH_E2E_APP).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
artifactName: DesignStash-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.graphics-design
  # Beta builds are ad-hoc signed (pnpm package:mac passes identity "-" and turns certificate
  # discovery off): no Developer ID and no notarization, but a valid seal over the whole bundle.
  # Without it the bundle keeps Electron's own linker signature, which no longer matches once the
  # app's files are added, and macOS calls a downloaded copy "damaged" with no Open Anyway.
  # Signing is a config change: provide the certificate and run pnpm package:mac:signed (see
  # scripts/packaging/README.md for the exact secrets).
  # Signing walks every Mach-O file in the app, the extra resources included, so llama-server and
  # the Swift helper are signed with the app's identity and the hardened runtime. The helper is
  # signed without entitlements; check Vision and Foundation Models on the first signed build
  # (design/specs/ai.md, "Open").
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: scripts/packaging/entitlements.mac.plist
  entitlementsInherit: scripts/packaging/entitlements.mac.plist
  # Off by default so an unsigned build never tries. package:mac:signed turns it on
  # (-c.mac.notarize=true); electron-builder then reads APPLE_API_KEY, APPLE_API_KEY_ID and
  # APPLE_API_ISSUER, or APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID.
  notarize: false
dmg:
  title: DesignStash ${version}
# The migrations, llama-server and the Swift helper are read at run time from <resources>, next
# to the app. The main process looks for the helper at <resources>/helper/designstash-helper.
# The bundled fonts' licences go to <resources>/licenses, as the SIL Open Font License requires.
extraResources:
  - from: drizzle
    to: drizzle
  - from: licenses
    to: licenses
  - from: build/llama-server
    to: llama-server
    filter:
      - '**/*'
  - from: build/helper
    to: helper
    filter:
      - designstash-helper
