name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64), matches the target platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Design system in sync with the Figma snapshot
        run: pnpm ds:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # E2E (Playwright + Electron) runs separately once stabilised on CI runners.
