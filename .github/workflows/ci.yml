name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going, so quick pushes
# don't pile up runs on the macOS machines.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64), matches the target platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Design system in sync with the Figma snapshot
        run: pnpm ds:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  # The Electron suite, once lint, unit tests and the build pass. Every test launches the built app
  # with its own userData folder and a stub AI. Specs that need the real mockup test set skip
  # themselves when it isn't there, as here.
  e2e:
    needs: build
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tests need a display of at least 1440×900; this shows what the runner has.
      - name: Display
        run: system_profiler SPDisplaysDataType | grep -i resolution || true

      - name: E2E (Playwright + Electron)
        run: pnpm test:e2e

      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
